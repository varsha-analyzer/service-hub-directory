<!DOCTYPE html>
<html>
<head>
<title>Service Hub Directory</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container-box">
<div class="left">
<img src="{{ url_for('static', filename='logohub.png') }}" alt="logohub">
<h1>Service Hub Directory</h1>
<p class="tag">
Connecting Communities with Trusted Local Services
</p>
<ul>
<li>✔ Verified Professionals</li>
<li>✔ Easy Service Booking</li>
<li>✔ Customer Rewards</li>
<li>✔ Safe & Secure Platform</li>
</ul>
<h5>"Your One-Stop Destination for Every Local Service."</h5>
</div>
<div class="right">
<div class="card p-4 shadow">
<h2>Welcome</h2>
<p>Login to continue</p>
<!-- LOGIN FORM START -->
<form method="POST" action="login">
    <input type="email" name="email" class="form-control mb-3" placeholder="Email">
    <input type="password" name="password" class="form-control mb-3" placeholder="Password">
    <div class="d-flex justify-content-between mb-3">
        <label><input type="checkbox"> Remember</label>
        <a href="#">Forgot?</a>
    </div>
    <button type="submit" class="btn btn-primary w-100">LOGIN</button>
</form>
<!-- LOGIN FORM END -->
<p class="text-center mt-3">
New User?
<a href="#">Register</a>
</p>
</div>
</div>
</div>
</body>
</html>
